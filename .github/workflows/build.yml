name: Android CI Build v3.64

on:
  push:
    branches: [ "main", "experiment/restore-legacy-rolling-display-capture-20261110" ]
  pull_request:
  workflow_dispatch:
    inputs:
      sign_for_updates:
        description: 'Sign a reviewed build with the permanent Driverade key'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PERMANENT_SIGNING_REQUESTED: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/experiment/restore-legacy-rolling-display-capture-20261110') || (github.event_name == 'workflow_dispatch' && inputs.sign_for_updates) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.7'

      - name: Set monotonically increasing version code
        shell: bash
        run: echo "DRIVERADE_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Run parser comparison unit tests
        run: gradle testDebugUnitTest

      # PRs and other non-signing runs use a distinctly labeled test artifact.
      - name: Build CI test APK (debug signing only)
        if: env.PERMANENT_SIGNING_REQUESTED != 'true'
        run: gradle assembleDebug

      # The owner approved signing pushes to the named experimental branch.
      # Never restore signing keys from a cache or expose them to PR builds.
      - name: Build APK with permanent signing key
        if: env.PERMANENT_SIGNING_REQUESTED == 'true'
        shell: bash
        env:
          DRIVERADE_KEYSTORE_BASE64: ${{ secrets.DRIVERADE_KEYSTORE_BASE64 }}
          DRIVERADE_KEYSTORE_PASSWORD: ${{ secrets.DRIVERADE_KEYSTORE_PASSWORD }}
          DRIVERADE_KEY_ALIAS: ${{ secrets.DRIVERADE_KEY_ALIAS }}
          DRIVERADE_KEY_PASSWORD: ${{ secrets.DRIVERADE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in DRIVERADE_KEYSTORE_BASE64 DRIVERADE_KEYSTORE_PASSWORD DRIVERADE_KEY_ALIAS DRIVERADE_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required permanent signing secret: $key"
              exit 1
            fi
          done
          export DRIVERADE_KEYSTORE_PATH="$RUNNER_TEMP/driverade-updates.jks"
          trap 'rm -f "$DRIVERADE_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$DRIVERADE_KEYSTORE_BASE64" | base64 --decode > "$DRIVERADE_KEYSTORE_PATH"
          test -s "$DRIVERADE_KEYSTORE_PATH"
          keytool -list -keystore "$DRIVERADE_KEYSTORE_PATH" \
            -storepass:env DRIVERADE_KEYSTORE_PASSWORD \
            -alias "$DRIVERADE_KEY_ALIAS" >/dev/null
          gradle assembleDebug

      # Build #236 / versionCode 10236 is the established in-place-update identity.
      # This public certificate fingerprint was independently checked against its APK.
      # Never rotate the permanent signer or reuse a lower version code by accident.
      - name: Verify APK identity and prepare distinctly named artifact
        shell: bash
        env:
          DRIVER_CERT_SHA256: a825f5a6602891307f4fefa1b255e795c50e30a9f3e80aefb3d5daf7e5249b16
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::Android SDK path is not available"
            exit 1
          fi
          apksigner="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          aapt="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -name aapt -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt"
          verify_output="$("$apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verify_output"
          signer_sha="$(printf '%s\n' "$verify_output" | awk '/certificate SHA-256 digest:/ {print tolower($NF); exit}')"
          if [[ -z "$signer_sha" ]]; then
            echo "::error::Could not read APK signing certificate digest"
            exit 1
          fi
          package_line="$("$aapt" dump badging "$apk" | grep -m1 '^package:')"
          if [[ "$package_line" != *"name='com.driverade'"* ||
                "$package_line" != *"versionCode='${DRIVERADE_VERSION_CODE}'"* ]]; then
            echo "::error::Unexpected Android package or versionCode in APK"
            exit 1
          fi
          if [[ "$PERMANENT_SIGNING_REQUESTED" == "true" ]]; then
            if [[ "$signer_sha" != "$DRIVER_CERT_SHA256" ]]; then
              echo "::error::Permanent update signing certificate does not match installed build #236. Refusing artifact."
              exit 1
            fi
            if (( DRIVERADE_VERSION_CODE <= 10236 )); then
              echo "::error::Permanent update versionCode must exceed baseline installed version 10236"
              exit 1
            fi
            filename="Driverade-UPDATE-${DRIVERADE_VERSION_CODE}.apk"
            echo "Verified permanent update: package=com.driverade versionCode=${DRIVERADE_VERSION_CODE} signer=$signer_sha"
          else
            filename="Driverade-CI-DEBUG-${DRIVERADE_VERSION_CODE}.apk"
            echo "CI debug build only: do not install over a permanent-signed Driverade"
          fi
          cp "$apk" "app/build/outputs/apk/debug/$filename"

      - name: Upload CI test APK (not an in-place update)
        if: env.PERMANENT_SIGNING_REQUESTED != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Driverade-CI-DEBUG-NOT-FOR-UPDATES
          path: app/build/outputs/apk/debug/Driverade-CI-DEBUG-*.apk
          if-no-files-found: error

      - name: Upload permanent-signed update APK
        if: env.PERMANENT_SIGNING_REQUESTED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Driverade-PERMANENT-SIGNED-UPDATE
          path: app/build/outputs/apk/debug/Driverade-UPDATE-*.apk
          if-no-files-found: error
