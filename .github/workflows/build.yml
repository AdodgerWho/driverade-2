name: Android CI Build v3.63

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Persistent Signing Keystore
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: driverade-debug.keystore
          key: driverade-persistent-signing-keystore-v1

      - name: Require and configure persistent DEVELOPMENT signing key
        run: |
          if [ ! -s driverade-debug.keystore ]; then
            echo "ERROR: development signing key cache is missing. Do not silently rotate signing keys."
            exit 1
          fi
          keytool -list -v -keystore driverade-debug.keystore \
            -storepass driverade_password -alias driverade_key | grep -E 'SHA256:|Owner:'
          echo "DRIVERADE_KEYSTORE_PATH=$GITHUB_WORKSPACE/driverade-debug.keystore" >> "$GITHUB_ENV"
          echo "DRIVERADE_KEYSTORE_PASSWORD=driverade_password" >> "$GITHUB_ENV"
          echo "DRIVERADE_KEY_ALIAS=driverade_key" >> "$GITHUB_ENV"
          echo "DRIVERADE_KEY_PASSWORD=driverade_password" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.7'

      - name: Run parser comparison unit tests
        run: gradle testDebugUnitTest

      - name: Build Driverade APK
        run: gradle assembleDebug

      - name: Rename Output to Driverade.apk
        run: |
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/Driverade.apk

      - name: Upload Driverade APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Driverade
          path: app/build/outputs/apk/debug/Driverade.apk
