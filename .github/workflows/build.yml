name: Driverade Android Debug APK

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Restore update signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.DRIVERADE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/driverade-updates.jks"
            echo "DRIVERADE_KEYSTORE_PATH=$RUNNER_TEMP/driverade-updates.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Stable update signing is NOT configured; debug APK may require uninstall before install."
          fi
      - name: Build APK
        env:
          DRIVERADE_KEYSTORE_PASSWORD: ${{ secrets.DRIVERADE_KEYSTORE_PASSWORD }}
          DRIVERADE_KEY_ALIAS: ${{ secrets.DRIVERADE_KEY_ALIAS }}
          DRIVERADE_KEY_PASSWORD: ${{ secrets.DRIVERADE_KEY_PASSWORD }}
          DRIVERADE_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug
      - name: Verify APK identity and certificate
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep '^package:'
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | grep 'Signer #1 certificate SHA-256 digest:'
          cp "$APK" app/build/outputs/apk/debug/Driverade.apk
      - name: Upload Driverade APK
        uses: actions/upload-artifact@v4
        with:
          name: Driverade
          path: app/build/outputs/apk/debug/Driverade.apk
          retention-days: 30
