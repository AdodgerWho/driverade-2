name: Android CI Build v3.63

on:
  push:
    branches: [ "main", "experiment/**", "feature/**", "test/**", "fix/**", "integration/**", "policy/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Persistent Signing Keystore
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: driverade-debug.keystore
          key: driverade-persistent-signing-keystore-v1

      - name: Ensure Persistent Keystore Exists
        run: |
          if [ ! -f driverade-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore driverade-debug.keystore \
              -alias driverade_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass driverade_password \
              -keypass driverade_password \
              -dname "CN=Driverade, OU=Mobile, O=Driverade, L=Richfield, ST=MN, C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.7'

      - name: Run parser comparison unit tests
        run: gradle testDebugUnitTest

      - name: Build Driverade APK
        run: gradle assembleDebug

      - name: Rename Output to Driverade.apk
        run: |
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/Driverade.apk

      - name: Upload Driverade APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Driverade
          path: app/build/outputs/apk/debug/Driverade.apk
